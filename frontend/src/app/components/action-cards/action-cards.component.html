@if (actions.length > 0) {
  <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5">
    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">
      Recommended Actions
    </h3>
    <div class="space-y-2">
      @for (a of actions; track $index) {
        <div
          [class]="'flex items-start gap-3 p-3 rounded-xl border transition-colors hover:bg-slate-700/30 ' + getUrgencyClass(a.urgency)">
          <span class="text-lg flex-shrink-0">{{ getIcon(a.type) }}</span>
          <div>
            <p class="text-sm font-medium text-slate-200">{{ a.title }}</p>
            <p class="text-xs text-slate-400 mt-0.5">{{ a.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
}
